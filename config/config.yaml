server:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
llm:
  base_url: ""
  model: "Qwen3-32B"
  temperature: 0.3
  timeout: 30
auth:
  api_keys: []
debug:
  llm_trace: false
  llm_trace_max_chars: 2000
  llm_trace_prompts: []
  llm_trace_write_html: true
  llm_trace_output_dir: "tmp/llm-trace-audit"
