a1a_party_extraction:
  system: |
    你是一个合同信息提取助手。只提取，不判断。
    【重要】只输出纯JSON，不要任何解释文字、不要markdown代码块，直接输出JSON对象。
  user: |
    请从以下合同全文中提取合同首部签约方、签章区块签约方和正文分节。
    输出字段必须包含：header、signature_parties、sections。
    header中必须包含project_name；若首页出现“项目名称”，填入project_name。
    header中必须包含project_number；若首页出现“项目编号/项目号/招标编号/采购编号”，填入project_number。
    contract_number只提取“合同编号/合同号/协议编号”等合同自身编号；项目编号不能填入contract_number。
    若“合同编号”标签存在但后面为空，contract_number必须为null，不能用项目编号代替。
    header.parties只提取合同首部中被明确标注为甲方、乙方或其他签约方的主体；合同名称、项目名称、项目背景和历史项目中出现的公司名称不得填入parties。
    每个party必须包含aliases，仅填写与该主体定义同时明确声明的简称；“甲方”“乙方”等角色本身不填入aliases，未声明简称时返回空数组。
    JSON结构示例：
    {{
      "header": {{
        "contract_name": null,
        "project_name": null,
        "project_number": null,
        "contract_number": null,
        "signing_location": null,
        "signing_date": null,
        "parties": [{{"role": "甲方", "name": "客户公司", "aliases": []}}]
      }},
      "signature_parties": [{{"role": "乙方", "name": "我方公司"}}],
      "sections": [{{"title": "附件一", "content": "附件正文内容"}}]
    }}
    【合同全文】
    {full_text}

a1b_our_signature:
  system: |
    你是一个合同信息提取助手。只提取我方签署主体签章区块信息。
    【重要】只输出纯JSON，不要任何解释文字、不要markdown代码块，直接输出JSON对象。
  user: |
    我方签署主体：{our_party}
    JSON结构示例：
    {{
      "signature": {{
        "role": "乙方",
        "name": "{our_party}",
        "legal_rep_name": null,
        "signer_id_number": null,
        "signing_date": null,
        "bank_name": null,
        "bank_account": null,
        "account_holder": null,
        "address": null,
        "phone": null,
        "fax": null,
        "website": null,
        "postal_code": null
      }}
    }}
    【合同全文】
    {full_text}

a3_amount_payment:
  system: |
    你是一个合同信息提取助手。只提取价格和付款条款字段。
    【重要】只输出纯JSON，不要任何解释文字、不要markdown代码块，直接输出JSON对象。
  user: |
    JSON结构示例：
    {{
      "currency": "人民币",
      "payment_method": "电汇",
      "total_amount_numeric": "100",
      "total_amount_evidence": "本合同最终含税总价为100元（大写：壹佰元整）。",
      "total_amount_uppercase": "壹佰元整",
      "total_amount_match": true,
      "payment_stages": [
        {{"stage_name": "首付款", "percentage": "50", "amount_numeric": "50", "amount_uppercase": "伍拾元整"}}
      ]
    }}
    `总价`存在时，total_amount_evidence 必须摘录合同正文中同时包含该数值的完整短句；无法找到时返回 null。
    【合同全文】
    {full_text}

a4_copies_attachments:
  system: |
    你是一个合同信息提取助手。只提取合同份数和附件声明。
    【重要】只输出纯JSON，不要任何解释文字、不要markdown代码块，直接输出JSON对象。
  user: |
    JSON结构示例：
    {{
      "copies": {{
        "total_copies": 2,
        "party_copies": [{{"role": "甲方", "copies": 1}}, {{"role": "乙方", "copies": 1}}]
      }},
      "attachments_declared": [
        {{"index": 1, "title": "附件一", "content_embedded_in_contract": false, "section_heading_hint": null}}
      ],
      "total_declared": 1
    }}
    【合同全文】
    {full_text}

b1_appellation:
  system: |
    你是一个合同审查助手。检查各签约方称谓是否全文统一。
    【重要】只输出纯JSON，不要任何解释文字、不要markdown代码块，直接输出JSON对象。
  user: |
    你只检查“签约主体称谓是否一致”。首页明确的签约方基准及其明确简称是唯一合法称谓集合。
    合同名称、项目名称、项目编号、背景或历史项目引用中出现的公司名称不是签约方称谓证据，不得输出WARN/FAIL。
    当前文本仅代表“{scope_label}”；不得引用合同正文、其他附件或任何当前文本之外的内容作为证据。
    对附件：若出现“甲方”或“乙方”等角色但未在附件内明确写出该角色对应的主体，必须输出WARN，evidence_type为role_without_definition；不得因为首页已有定义而直接通过。
    若附件内明确写出“甲方：某主体”“乙方：某主体”或等价定义，必须与签约方基准中同角色的法定全称或明确简称比对；不一致时输出WARN，evidence_type为party_definition。
    每个WARN/FAIL必须返回一条结构化观察，所有字段必须存在：
    - role：首页签约方角色；
    - baseline_appellation：该角色的首页法定全称；
    - found_appellation：当前文本中发现的未声明称谓；
    - evidence_quote：只摘录当前文本内能证明称谓使用的完整短句；
    - evidence_type：普通签约方称谓使用 party_appellation，附件内角色主体定义使用 party_definition，附件内角色未定义主体使用 role_without_definition。合同或项目名称使用 contract_or_project_name，背景或历史项目引用使用 background_reference，无法判断使用 unknown。
    evidence_type 为 party_appellation 或 party_definition 时，仅发现称谓不属于首页法定全称或明确简称才输出WARN/FAIL；evidence_type 为 role_without_definition 时，附件内出现该角色即输出WARN；其他情况返回空checks。
    JSON结构示例：
    {{
      "checks": [
        {{"result": "WARN", "block_level": "提示", "role": "乙方", "baseline_appellation": "供应商", "found_appellation": "卖方", "evidence_quote": "卖方应于第3条约定期限内交付。", "evidence_type": "party_appellation"}}
      ]
    }}
    【签约方基准】
    {parties}
    【当前检查范围】
    {scope_label}
    【当前文本】
    {segment_text}
b4_attachment_content:
  system: |
    你是一个合同审查助手。检查附件内容与合同正文关键信息是否一致。
    【重要】只输出纯JSON，不要任何解释文字、不要markdown代码块，直接输出JSON对象。
  user: |
    若检查附件总价，只有在【比对基准】的 amount_payment 同时给出 total_amount_numeric 和 total_amount_evidence 时才可输出该问题；不得自行推断合同正文金额。
    总价不一致时，check_type 必须为 total_amount，attachment_value 为附件总价数值，attachment_evidence 为当前附件内同时包含该数值的完整短句，reason 为 null。
    非金额问题使用 check_type=other，attachment_value 和 attachment_evidence 为 null，reason 说明问题；无问题返回空 checks。
    JSON结构示例：
    {{
      "checks": [
        {{"result": "FAIL", "block_level": "硬阻断", "check_type": "total_amount", "attachment_value": "3286000", "attachment_evidence": "附件含税总价为3286000元。", "reason": null}}
      ]
    }}
    【比对基准】
    {baseline}
    【当前附件】
    {attachment_text}

attachment_title_matching:
  system: |
    你是合同附件名称对应关系审查助手。只输出符合 JSON Schema 的结果，不输出解释文字或 markdown。
  user: |
    请将“上传附件候选”逐个与“正文声明附件候选”判断是否为同一附件。
    仅当名称表达同一附件时返回 MATCH；附件编号、文件扩展名、版本、日期或排版修饰可能不改变标题含义，但任何可能改变文件性质的文字不得自行忽略。
    例如“补充协议”“模板”“作废”“旧版”等若无法确认是否仍为同一附件，必须返回 UNCERTAIN，不得猜测。
    每个上传附件候选必须输出一项 decision。没有可对应的正文声明附件时，declared_id 返回 null；无法确认时 judgement 返回 UNCERTAIN。
    不得让同一 declared_id 对应多个 uploaded_id，也不得让同一 uploaded_id 对应多个 declared_id。

    【正文声明附件候选】
    {declared_attachments}

    【上传附件候选】
    {uploaded_attachments}
